<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Szelekció szimuláció</title>
<style>
    body { font-family: Arial; text-align: center; }
    #gameArea {
        width: 800px;
        height: 400px;
        margin: auto;
        position: relative;
        border: 2px solid black;
        overflow: hidden;
    }
    .vole {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        position: absolute;
        cursor: pointer;
    }
    #charts {
        display: flex;
        justify-content: space-around;
        margin-top: 20px;
    }
    canvas {
        background: #ddd;
        padding: 10px;
    }
</style>
</head>

<body>

<h2>Szelekció szimuláció</h2>
<p>Készítette: Szepesváry Csaba</p>

<button id="startBtn" onclick="startGame()">Start</button>
<button id="nextBtn" onclick="nextRound()" style="display:none;">Tovább</button>
<button onclick="resetGame()">Új játék</button>

<p id="info"></p>

<div id="gameArea"></div>
<div id="charts"></div>

<script>
let colors = [
    "rgb(250,250,250)",
    "rgb(155,155,155)",
    "rgb(5,5,5)"
];

let population = [];
let round = 0;
let timeLeft = 30;
let timer = null;
let animation = null;
let totalCaught = 0;

let roundNames = [
    "Fehér háttér",
    "Szürke háttér",
    "Fekete háttér",
    "Sávos háttér"
];

function stopGameLoops() {
    if (timer) clearInterval(timer);
    if (animation) cancelAnimationFrame(animation);
    timer = null;
    animation = null;
}

// 🔄 TELJES RESET
function resetGame() {
    stopGameLoops();

    population = [];
    round = 0;
    totalCaught = 0;

    document.getElementById("charts").innerHTML = "";
    document.getElementById("info").innerText = "";

    let area = document.getElementById("gameArea");
    area.innerHTML = "";
    area.style.background = "white";
    area.style.display = "block";

    document.getElementById("startBtn").disabled = false;
    document.getElementById("nextBtn").style.display = "none";
}

function createPopulation() {
    population = [];
    for (let i = 0; i < 17; i++) {
        for (let c = 0; c < 3; c++) {
            population.push({
                colorIndex: c,
                x: Math.random() * 780,
                y: Math.random() * 380,
                dx: (Math.random() - 0.5) * 2.5,
                dy: (Math.random() - 0.5) * 2.5
            });
        }
    }
    population.sort(() => Math.random() - 0.5);
}

function drawPopulation() {
    const area = document.getElementById("gameArea");
    area.innerHTML = "";

    population.forEach((vole) => {
        let div = document.createElement("div");
        div.className = "vole";
        div.style.background = colors[vole.colorIndex];
        div.style.left = vole.x + "px";
        div.style.top = vole.y + "px";

        div.onclick = () => {
            totalCaught++;
            population = population.filter(v => v !== vole);
        };

        vole.element = div;
        area.appendChild(div);
    });
}

function animate() {
    population.forEach(v => {
        v.x += v.dx;
        v.y += v.dy;

        if (v.x < 0 || v.x > 780) v.dx *= -1;
        if (v.y < 0 || v.y > 380) v.dy *= -1;

        if (v.element) {
            v.element.style.left = v.x + "px";
            v.element.style.top = v.y + "px";
        }
    });

    animation = requestAnimationFrame(animate);
}

function setBackground() {
    const area = document.getElementById("gameArea");

    if (round === 0) area.style.background = "white";
    if (round === 1) area.style.background = "rgb(150,150,150)";
    if (round === 2) area.style.background = "black";

    if (round === 3) {
        area.style.background =
        "linear-gradient(to right, \
        white 0%, white 16.6%, \
        black 16.6%, black 33.3%, \
        white 33.3%, white 50%, \
        black 50%, black 66.6%, \
        white 66.6%, white 83.3%, \
        black 83.3%, black 100%)";
    }
}

function startRound() {
    stopGameLoops();

    document.getElementById("nextBtn").style.display = "none";

    setBackground();
    createPopulation();
    drawPopulation();
    animate();

    timeLeft = 30;

    timer = setInterval(() => {
        document.getElementById("info").innerText =
            `Kör: ${round + 1} | Idő: ${timeLeft}s | Egyedek: ${population.length}`;

        timeLeft--;

        if (timeLeft < 0) {
            clearInterval(timer);
            cancelAnimationFrame(animation);
            endRound();
        }
    }, 1000);
}

function endRound() {
    let counts = [0,0,0];
    population.forEach(v => counts[v.colorIndex]++);

    drawChart(counts, roundNames[round]);

    document.getElementById("info").innerText =
        `${roundNames[round]} vége | Fehér: ${counts[0]}, Szürke: ${counts[1]}, Fekete: ${counts[2]} | Összes levadászott: ${totalCaught}`;

    document.getElementById("nextBtn").style.display = "inline";
}

function nextRound() {
    round++;
    if (round < 4) {
        startRound();
    } else {
        document.getElementById("info").innerText =
            `Játék vége | Összes levadászott: ${totalCaught}`;
        document.getElementById("gameArea").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("startBtn").disabled = false;
    }
}

function drawChart(data, title) {
    let container = document.createElement("div");

    let label = document.createElement("div");
    label.innerText = title;
    container.appendChild(label);

    let canvas = document.createElement("canvas");
    canvas.width = 300;
    canvas.height = 220;
    let ctx = canvas.getContext("2d");

    let max = Math.max(...data);

    data.forEach((val, i) => {
        let x = i * 90;
        let h = (val / max) * 150;

        ctx.fillStyle = colors[i];
        ctx.fillRect(x + 70, 180 - h, 50, h);
    });

    ctx.fillStyle = "black";
    ctx.fillText("Fehér – Szürke – Fekete", 70, 210);

    ctx.save();
    ctx.translate(15, 150);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Egyedszám", 0, 0);
    ctx.restore();

    container.appendChild(canvas);
    document.getElementById("charts").appendChild(container);
}

function startGame() {
    stopGameLoops();

    document.getElementById("charts").innerHTML = "";
    document.getElementById("gameArea").style.display = "block";

    document.getElementById("startBtn").disabled = true;

    round = 0;
    totalCaught = 0;

    startRound();
}
</script>

</body>
</html>
